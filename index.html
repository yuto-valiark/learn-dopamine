<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>AlgoTap</title>
  <style>
    :root {
      --bg: #0b1220; --card: #141c2e; --text: #f1f5f9; --muted: #94a3b8;
      --accent: #38bdf8; --ok: #34d399; --bad: #fb7185;
      --top: 0px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text);
      font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; }
    html.bg-on {
      background-color: #0b1220;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }
    html.bg-on::before {
      content: "";
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background: rgba(11,18,32,.62);
    }
    html.bg-on body { background: transparent; }
    html.bg-on .top { background: rgba(11,18,32,.82); }
    body { padding: 0 0 calc(24px + env(safe-area-inset-bottom)); max-width: 520px; margin: 0 auto; position: relative; z-index: 1; }
    .top {
      position: sticky; top: 0; z-index: 20; background: rgba(11,18,32,.94);
      backdrop-filter: blur(8px); padding: 10px 12px 8px;
      border-bottom: 1px solid #1e293b;
    }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; gap: 8px; }
    .tap-random {
      display: none; width: 100%; margin: 0 0 8px; border-radius: 14px;
      padding: 12px 14px; font-size: 15px; font-weight: 800;
      background: var(--accent); color: #0b1220;
    }
    .tap-random.on { display: block; }
    h1 { font-size: 14px; margin: 0; font-weight: 800; cursor: pointer; }
    .meta { color: var(--muted); font-size: 11px; margin-left: auto; }
    .progress { height: 4px; background: #1e293b; border-radius: 99px; overflow: hidden; margin-bottom: 6px; }
    .progress > span { display: block; height: 100%; background: linear-gradient(90deg,#22d3ee,#34d399); width: 0%; }
    .menu-btn {
      width: 36px; height: 36px; padding: 0; border-radius: 12px; font-size: 18px; line-height: 1;
      background: #1e293b; color: var(--text); flex: 0 0 36px;
    }
    .menu-btn.on { background: var(--accent); color: #0b1220; }
    .menu-sheet {
      display: none; flex-wrap: wrap; gap: 6px; padding: 8px 0 4px;
    }
    .menu-sheet.on { display: flex; }
    .filters { display: contents; }
    button {
      border: 0; border-radius: 999px; padding: 10px 14px; font-size: 14px; font-weight: 700;
      background: #1e293b; color: var(--text);
    }
    .menu-sheet button {
      padding: 6px 10px; font-size: 12px; font-weight: 700; line-height: 1.2;
    }
    .menu-sheet button.active { background: var(--accent); color: #0b1220; }
    #feed { padding: 10px 12px 80px; display: flex; flex-direction: column; gap: 14px; }
    .card {
      background: var(--card); border: 1px solid #243047; border-radius: 18px;
      padding: 16px 14px 18px; box-shadow: 0 8px 28px rgba(0,0,0,.28);
      scroll-margin-top: 110px;
    }
    .tagrow { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    .tag { font-size: 11px; color: #0b1220; background: #67e8f9; border-radius: 999px; padding: 3px 9px; font-weight: 800; }
    .tag.type-quiz { background: #fbbf24; }
    .difficulty {
      margin-left: auto; font-size: 12px; letter-spacing: .5px; color: #fbbf24;
      background: #422006; border: 1px solid #92400e; border-radius: 999px;
      padding: 3px 9px; font-weight: 900; white-space: nowrap;
    }
    .title { font-size: 18px; line-height: 1.4; margin: 0 0 8px; font-weight: 800; word-break: break-word; }
    .problem {
      font-size: 14px; line-height: 1.45; color: #cbd5e1; margin: 0 0 12px;
      padding: 10px 12px; border-radius: 12px; background: #0f172a; border-left: 3px solid var(--accent);
    }
    .block { margin: 0 0 12px; }
    .label { font-size: 12px; color: var(--muted); margin-bottom: 4px; font-weight: 800; }
    .one { font-size: 18px; line-height: 1.4; font-weight: 800; }
    .body { font-size: 16px; line-height: 1.55; white-space: pre-wrap; }
    .trap .body { color: #fdba74; }
    .detail .body { color: #e2e8f0; font-size: 14px; }
    pre.code {
      margin: 0; padding: 12px; border-radius: 12px; background: #0a0f1a; color: #e2e8f0;
      font-size: 13px; line-height: 1.45; overflow-x: auto; white-space: pre;
      font-family: ui-monospace, Menlo, monospace; -webkit-overflow-scrolling: touch;
    }
    .choices { display: grid; gap: 8px; }
    .choices button {
      border-radius: 14px; text-align: left; padding: 12px; font-size: 14px; line-height: 1.4;
      background: #1e293b; border: 2px solid #334155;
    }
    .choices button.correct { background: #064e3b; border-color: var(--ok); }
    .choices button.wrong { background: #4c0519; border-color: var(--bad); }
    .explain { margin-top: 10px; padding: 12px; border-radius: 12px; background: #0f766e33; font-size: 14px; line-height: 1.5; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
    .actions .speak { grid-column: 1 / -1; background: var(--ok); color: #052e1c; font-size: 15px; padding: 12px; }
    .actions .mark.on { background: #7c3aed; }
    .actions .learned.on { background: #059669; }
    .notes { margin-top: 4px; padding: 12px; border-radius: 12px; background: #111827; border: 1px solid #334155; }
    .notes .label { margin-bottom: 8px; }
    .notes dl { margin: 0; display: grid; gap: 10px; }
    .notes dt { font-size: 13px; font-weight: 800; color: #7dd3fc; }
    .notes dd { margin: 2px 0 0; font-size: 13px; line-height: 1.45; color: #cbd5e1; }
    #gloss-view { display: none; padding: 10px 12px 100px; max-width: 100%; overflow-x: hidden; }
    #gloss-view.on { display: block; }
    #feed.hide { display: none; }
    .jump.hide { display: none; }
    .gloss-search {
      width: 100%; max-width: 100%; margin-bottom: 10px; padding: 12px 14px; border-radius: 12px;
      border: 1px solid #334155; background: #0f172a; color: var(--text); font-size: 16px;
      box-sizing: border-box; -webkit-appearance: none; appearance: none;
    }
    .gloss-meta { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
    .gloss-list { display: flex; flex-direction: column; gap: 8px; }
    .gloss-item {
      padding: 12px; border-radius: 12px; background: #141c2e; border: 1px solid #243047;
    }
    .gloss-item .term {
      font-weight: 800; color: #7dd3fc; font-size: 14px; line-height: 1.35;
      margin-bottom: 6px; word-break: break-word; overflow-wrap: anywhere;
    }
    .gloss-item .def {
      font-size: 13px; line-height: 1.5; color: #cbd5e1;
      word-break: break-word; overflow-wrap: anywhere;
    }
    .gloss-empty { color: var(--muted); padding: 30px 8px; text-align: center; }

    /* 幅があるときだけ2カラム表 */
    @media (min-width: 520px) {
      .gloss-list { display: none; }
      .gloss-table-wrap { display: block; overflow-x: auto; -webkit-overflow-scrolling: touch; }
      .gloss-table { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
      .gloss-table th, .gloss-table td {
        text-align: left; vertical-align: top; padding: 10px 8px;
        border-bottom: 1px solid #1e293b; line-height: 1.45;
        word-break: break-word; overflow-wrap: anywhere;
      }
      .gloss-table th { color: var(--muted); font-size: 11px; position: sticky; top: 108px; background: #0b1220; z-index: 1; }
      .gloss-table .term-col { width: 32%; font-weight: 800; color: #7dd3fc; }
    }
    @media (max-width: 519px) {
      .gloss-table-wrap { display: none; }
    }
    .end { text-align: center; color: var(--muted); font-size: 12px; padding: 20px 0 40px; }
    .jump {
      position: fixed; right: max(10px, calc(50% - 250px + 10px)); bottom: calc(16px + env(safe-area-inset-bottom));
      display: flex; flex-direction: column; gap: 8px; z-index: 30;
    }
    .jump button {
      width: 56px; height: 56px; border-radius: 18px; font-size: 22px; padding: 0;
      background: #1e293b; border: 1px solid #334155; box-shadow: 0 6px 18px rgba(0,0,0,.35);
      display: flex; align-items: center; justify-content: center;
    }
    .jump #shuffle {
      width: 56px; height: 56px; font-size: 26px; background: #0ea5e9; color: #0b1220;
      border-color: #38bdf8;
    }
    .jump #podcast {
      width: 56px; height: 56px; font-size: 22px; background: #334155; color: #f8fafc;
      border-color: #64748b;
    }
    .jump #podcast.on {
      background: #f97316; color: #0b1220; border-color: #fb923c;
      animation: pod-pulse 1.6s ease-in-out infinite;
    }
    @keyframes pod-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }
    .pod-banner {
      display: none; margin: 0 0 8px; padding: 8px 10px; border-radius: 12px;
      background: #431407; border: 1px solid #c2410c; color: #fed7aa;
      font-size: 12px; line-height: 1.4; font-weight: 700;
    }
    .pod-banner.on { display: block; }

    #tap-view { display: none; padding: 10px 12px 40px; }
    #tap-view.on { display: block; }
    .tap-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
    .tap-chips button {
      padding: 5px 10px; font-size: 12px; border-radius: 999px;
    }
    .tap-chips button.on { background: var(--accent); color: #0b1220; }
    .tap-item {
      background: var(--card); border: 1px solid #243047; border-radius: 16px;
      padding: 12px 12px 14px; margin-bottom: 10px; width: 100%;
      text-align: left; border-radius: 16px;
    }
    .tap-item .row { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
    .tap-item .ttl { font-weight: 800; font-size: 15px; }
    .tap-item .st { font-size: 11px; color: var(--muted); }
    .tap-item .st.ok { color: var(--ok); }
    .tap-item .st.ng { color: #fdba74; }
    .tap-lv { font-size: 11px; font-weight: 800; color: #0b1220; background: #67e8f9; border-radius: 999px; padding: 2px 8px; }
    .tap-back { margin-bottom: 10px; }
    .tap-prob { font-size: 14px; line-height: 1.55; color: #cbd5e1; padding: 10px 12px; border-radius: 12px; background: #0f172a; border-left: 3px solid var(--accent); margin-bottom: 10px; white-space: pre-wrap; }
    .tap-fold { margin: 0 0 8px; }
    .tap-fold summary {
      cursor: pointer; color: #7dd3fc; font-size: 12px; font-weight: 800;
      list-style: none;
    }
    .tap-fold summary::-webkit-details-marker { display: none; }
    .tap-fold pre {
      margin: 6px 0 0; padding: 8px 10px; border-radius: 10px; background: #0f172a;
      font-size: 12px; line-height: 1.35; color: #cbd5e1; white-space: pre-wrap;
      word-break: break-word; font-family: ui-monospace, Menlo, monospace;
    }
    .tap-io {
      display: grid; grid-template-columns: 1fr; gap: 8px;
      margin: 0 0 10px; align-items: start;
    }
    .tap-io.solo { grid-template-columns: 1fr; }
    .tap-io .col {
      padding: 8px 10px; border-radius: 10px; background: #0f172a; border: 1px solid #1e293b;
      min-width: 0;
    }
    .tap-io .k { font-size: 10px; font-weight: 800; color: #7dd3fc; margin: 0 0 4px; }
    .tap-io .k.out { color: #86efac; margin-top: 8px; }
    .tap-io pre {
      margin: 0; font-size: 12px; line-height: 1.35; color: #cbd5e1; white-space: pre-wrap;
      word-break: break-word; font-family: ui-monospace, Menlo, monospace;
    }
    .tap-pool, .tap-built {
      display: grid; gap: 8px; margin: 0 0 12px; min-height: 44px;
      padding: 6px; border-radius: 14px; border: 1px dashed transparent;
    }
    body.tap-on-drag .tap-pool,
    body.tap-on-drag .tap-built { border-color: #334155; }
    body.tap-on-drag .tap-built { border-color: #38bdf8; }
    .tap-line {
      display: flex; align-items: flex-start; gap: 8px;
      text-align: left; border-radius: 12px; padding: 10px 10px;
      font-size: 13px; font-family: ui-monospace, Menlo, monospace; line-height: 1.4;
      background: #1e293b; border: 2px solid #334155; color: #e2e8f0;
      overflow-wrap: anywhere; touch-action: none; user-select: none;
      -webkit-user-select: none; cursor: grab;
    }
    .tap-line:active { cursor: grabbing; }
    .tap-line.used { opacity: .28; }
    .tap-line.built { background: #0f172a; border-color: #38bdf8; }
    .tap-line.src { opacity: .35; }
    .tap-grip {
      flex: 0 0 10px; width: 10px; height: 16px; margin-top: 2px;
      background: radial-gradient(circle, #64748b 1.15px, transparent 1.3px);
      background-size: 5px 5px; opacity: .9;
    }
    .tap-code {
      flex: 1; min-width: 0; white-space: pre-wrap; word-break: break-word;
      font-family: ui-monospace, Menlo, monospace; font-size: 13px;
      border-left: 2px solid #334155;
    }
    .tap-line.ghost {
      position: fixed; z-index: 50; pointer-events: none; margin: 0;
      box-shadow: 0 12px 28px rgba(0,0,0,.45); transform: rotate(1deg) scale(1.02);
      opacity: .95;
    }
    .tap-ph {
      height: 6px; border-radius: 99px; background: var(--accent);
      margin: 2px 4px; pointer-events: none;
    }
    .tap-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .tap-actions .check { background: var(--ok); color: #052e1c; }
    .tap-sheet.ok .tap-actions { grid-template-columns: 1fr; }
    #tap-next {
      background: linear-gradient(180deg, #4ade80 0%, #16a34a 100%);
      color: #052e16; font-size: 16px; padding: 14px 16px;
      box-shadow: 0 0 0 1px #facc15, 0 10px 22px rgba(22,163,74,.38);
      animation: next-glow 1.6s ease-in-out infinite;
    }
    #tap-next:active { transform: scale(.98); }
    @keyframes next-glow {
      0%, 100% { box-shadow: 0 0 0 1px #facc15, 0 10px 22px rgba(22,163,74,.38); }
      50% { box-shadow: 0 0 0 2px #fde68a, 0 12px 28px rgba(250,204,21,.45); }
    }
    .tap-sheet {
      display: none; margin-top: 10px; padding: 12px; border-radius: 12px;
      background: #0f172a; border: 1px solid #334155; font-size: 13px; line-height: 1.5;
    }
    .tap-sheet.on { display: block; }
    .tap-sheet.ok { background: #0f766e33; border-color: #facc15; }
    .tap-sheet.ng { background: #4c051933; border-color: #fb7185; }
    .tap-streak { color: #fde68a; font-weight: 800; font-size: 12px; margin: 4px 0 0; }
    #tap-fx {
      position: fixed; inset: 0; z-index: 80; pointer-events: none;
      overflow: hidden; display: none;
    }
    #tap-fx.on { display: block; }
    .fx-toast {
      position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%);
      padding: 4px; border-radius: 20px; color: #fff;
      background: linear-gradient(130deg, #fff3b0, #f59e0b 28%, #fde68a 52%, #b45309 76%, #fff7cc);
      background-size: 220% 220%;
      box-shadow: 0 0 22px rgba(250,204,21,.55), 0 0 48px rgba(245,158,11,.32);
      animation: fx-toast 1.9s ease both, fx-gold 1.4s linear infinite;
    }
    .fx-inner {
      display: flex; align-items: center; gap: 16px;
      min-width: min(82vw, 328px); padding: 18px 24px 18px 18px;
      background: rgba(32, 32, 36, .92); border-radius: 16px;
    }
    .fx-mark {
      flex: 0 0 56px; width: 56px; height: 56px; border-radius: 50%;
      border: 5px solid #22c55e; box-shadow: 0 0 14px rgba(34,197,94,.55);
    }
    .fx-n { font-size: 34px; font-weight: 900; line-height: 1.05; letter-spacing: .04em; }
    .fx-sub { margin-top: 4px; font-size: 15px; font-weight: 700; color: #e5e7eb; }
    @keyframes fx-toast {
      0% { transform: translate(-50%, -42%) scale(.92); opacity: 0; }
      12% { transform: translate(-50%, -50%) scale(1.03); opacity: 1; }
      78% { transform: translate(-50%, -52%); opacity: 1; }
      100% { transform: translate(-50%, -54%); opacity: 0; }
    }
    @keyframes fx-gold {
      0% { background-position: 0% 50%; filter: brightness(1); }
      50% { background-position: 100% 50%; filter: brightness(1.22); }
      100% { background-position: 0% 50%; filter: brightness(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      #tap-next { animation: none !important; }
      .fx-toast { animation: none; }
    }
    .tap-pop {
      display: none; position: fixed; left: 12px; right: 12px; bottom: calc(18px + env(safe-area-inset-bottom));
      max-width: 496px; margin: 0 auto; z-index: 40;
      background: #141c2e; border: 1px solid #38bdf8; border-radius: 16px; padding: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,.45);
    }
    .tap-pop.on { display: block; }
    .tap-pop .k { font-size: 12px; color: #7dd3fc; font-weight: 800; margin-bottom: 6px; }
    .tap-pop code { display: block; font-size: 12px; color: #e2e8f0; margin-bottom: 8px; word-break: break-all; }
    .tap-help { font-size: 12px; color: var(--muted); margin: 0 0 10px; }
    .span-all { grid-column: 1 / -1; }
  </style>
</head>
<body>
  <div class="top">
    <header>
      <h1 id="home">AlgoTap</h1>
      <div class="meta" id="counter">—</div>
      <button type="button" class="menu-btn" id="menu-btn" aria-label="メニュー" aria-expanded="false">☰</button>
    </header>
    <button type="button" class="tap-random" id="tap-random">ランダムで出題開始</button>
    <div class="progress"><span id="bar"></span></div>
    <div class="pod-banner" id="pod-banner">ポッドキャスト再生中 · 読み上げ後に自動で次へ · 再タップで停止</div>
    <div class="menu-sheet" id="menu-sheet">
      <div class="filters">
        <button type="button" data-f="algotap" class="active">AlgoTap</button>
        <button type="button" data-f="all">全部</button>
        <button type="button" data-f="atcoder">AtCoder</button>
        <button type="button" data-f="security">セキュ</button>
        <button type="button" data-f="glossary">用語一覧</button>
        <button type="button" data-f="quiz">クイズ</button>
        <button type="button" data-f="code">コード</button>
        <button type="button" data-f="saved">☆保存</button>
        <button type="button" data-f="unlearned">未習</button>
        <button type="button" id="bg-btn">背景</button>
      </div>
    </div>
  </div>
  <div id="feed" class="hide"><div class="empty">読み込み中…</div></div>
  <div id="gloss-view">
    <input class="gloss-search" id="gloss-q" type="search" placeholder="用語を検索（例: IV, CBC, 累積和）" enterkeyhint="search" />
    <div class="gloss-meta" id="gloss-meta"></div>
    <div class="gloss-list" id="gloss-list"></div>
    <div class="gloss-table-wrap">
      <table class="gloss-table">
        <thead><tr><th class="term-col">用語</th><th>解説</th></tr></thead>
        <tbody id="gloss-body"></tbody>
      </table>
    </div>
    <div class="gloss-empty" id="gloss-empty" hidden>該当なし</div>
  </div>
  <div id="tap-view" class="on">
    <div id="tap-list"><div class="empty">読み込み中…</div></div>
    <div id="tap-solve" hidden></div>
    <div class="tap-pop" id="tap-pop"></div>
  </div>
  <div id="tap-fx" aria-hidden="true"></div>
  <div class="jump hide">
    <button type="button" id="prev" aria-label="前へ">↑</button>
    <button type="button" id="podcast" aria-label="ポッドキャスト" title="読み上げて自動送り">🎧</button>
    <button type="button" id="shuffle" aria-label="シャッフル">🔀</button>
    <button type="button" id="next" aria-label="次へ">↓</button>
  </div>

  <script>
    const KEY = "dopamine-progress-v2";
    const BATCH = 12;
    let cards = [];
    let glossary = [];
    let tapProblems = [];
    let tapFilter = "all";
    let tapQ = "";
    let tapCurrent = null;
    let tapPool = [];
    let tapBuilt = [];
    let tapStreak = 0;
    let tapFxTimer = 0;
    let tapLong = false;
    let tapDrag = null;
    let filtered = [];
    let idx = 0;
    let filter = "algotap";
    let shown = 0;
    let io = null;

    const feed = document.getElementById("feed");
    const glossView = document.getElementById("gloss-view");
    const glossBody = document.getElementById("gloss-body");
    const glossList = document.getElementById("gloss-list");
    const glossMeta = document.getElementById("gloss-meta");
    const glossEmpty = document.getElementById("gloss-empty");
    const glossQ = document.getElementById("gloss-q");
    const tapView = document.getElementById("tap-view");
    const tapList = document.getElementById("tap-list");
    const tapSolve = document.getElementById("tap-solve");
    const tapPop = document.getElementById("tap-pop");
    const tapRandom = document.getElementById("tap-random");
    const jump = document.querySelector(".jump");
    const counter = document.getElementById("counter");
    const bar = document.getElementById("bar");
    const menuBtn = document.getElementById("menu-btn");
    const menuSheet = document.getElementById("menu-sheet");

    function loadProg() {
      try { return JSON.parse(localStorage.getItem(KEY) || "{}"); } catch { return {}; }
    }
    function saveProg(p) { localStorage.setItem(KEY, JSON.stringify(p)); }
    function prog() {
      const p = loadProg();
      p.learned = p.learned || {};
      p.saved = p.saved || {};
      p.algotap = p.algotap || {};
      return p;
    }
    function shuffleInPlace(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
    }
    function esc(s) {
      return String(s || "")
        .replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;");
    }

    function tapProgress() {
      const tapOk = Object.values(prog().algotap || {}).filter(x => x && x.ok).length;
      const tapN = tapProblems.length;
      return { tapOk, tapN };
    }
    function updateStats() {
      const { tapOk, tapN } = tapProgress();
      bar.style.width = tapN ? `${(tapOk / tapN) * 100}%` : "0%";
      if (tapCurrent || filter === "glossary") return;
      counter.textContent = `${tapOk}/${tapN}`;
    }

    function setActiveIndex(i, scroll = false) {
      if (!filtered.length) {
        updateStats();
        return;
      }
      idx = Math.max(0, Math.min(i, filtered.length - 1));
      updateStats();
      if (scroll) {
        ensureShown(idx + 1);
        const el = document.getElementById(`card-${idx}`);
        if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
      }
    }

    function cardHTML(c, i) {
      const p = prog();
      const tags = [
        `<span class="tag type-${esc(c.type || "essence")}">${esc(c.type || "essence")}</span>`,
        `<span class="tag">${esc(c.track)}</span>`,
        ...(c.tags || []).slice(0, 3).map(t => `<span class="tag">${esc(t)}</span>`),
        ...(c.track === "atcoder" && c.difficulty
          ? [`<span class="difficulty" title="鉄則本基準の難易度目安">難易度 ${"★".repeat(c.difficulty)}${"☆".repeat(Math.max(0, (c.difficulty_scale || 5) - c.difficulty))}</span>`]
          : [])
      ].join("");

      const detailBlock = c.detail
        ? `<div class="block detail"><div class="label">詳細</div><div class="body">${esc(c.detail)}</div></div>`
        : "";
      const notesBlock = (c.notes && c.notes.length)
        ? `<div class="block notes"><div class="label">備考（用語）</div><dl>${
            c.notes.map(n => `<div><dt>${esc(n.term)}</dt><dd>${esc(n.def)}</dd></div>`).join("")
          }</dl></div>`
        : "";
      const solCode = c.code
        ? `<div class="block"><div class="label">正解コード</div><pre class="code">${esc(c.code)}</pre></div>`
        : "";
      const preview = c.code_preview || (c.type === "quiz" ? c.code : "");

      let main = "";
      if (c.type === "quiz" && c.quiz) {
        main = `
          <div class="block"><div class="label">問題</div><div class="body">${esc(c.quiz.question)}</div></div>
          ${preview ? `<div class="block"><div class="label">コード</div><pre class="code">${esc(preview)}</pre></div>` : ""}
          <div class="choices" data-qi="${i}">
            ${c.quiz.choices.map((ch, j) => `<button type="button" data-j="${j}">${esc(ch)}</button>`).join("")}
          </div>
          <div class="explain-slot"></div>
          <div class="sol-slot"></div>
          ${detailBlock}
          ${notesBlock}
        `;
      } else if (c.type === "code") {
        main = `
          <div class="block"><div class="label">① 見方</div><div class="one">${esc(c.one_liner)}</div></div>
          ${c.when ? `<div class="block"><div class="label">② いつ使う</div><div class="body">${esc(c.when)}</div></div>` : ""}
          ${solCode}
          ${detailBlock}
          ${c.trap ? `<div class="block trap"><div class="label">罠</div><div class="body">${esc(c.trap)}</div></div>` : ""}
          ${notesBlock}
        `;
      } else {
        const whenLabel = c.track === "atcoder" ? "② いつ使う" : "② 問い";
        main = `
          <div class="block"><div class="label">① 1行</div><div class="one">${esc(c.one_liner)}</div></div>
          ${c.when ? `<div class="block"><div class="label">${whenLabel}</div><div class="body">${esc(c.when)}</div></div>` : ""}
          ${c.track === "atcoder" ? solCode : ""}
          ${detailBlock}
          ${c.trap ? `<div class="block trap"><div class="label">罠</div><div class="body">${esc(c.trap)}</div></div>` : ""}
          ${notesBlock}
        `;
      }

      const learnedOn = p.learned[c.id] ? " on" : "";
      const savedOn = p.saved[c.id] ? " on" : "";
      const prob = (c.track === "atcoder" && (c.type === "code" || c.type === "quiz" || c.problem))
        ? (c.problem || "")
        : ((c.type === "code" || c.type === "quiz") ? (c.problem || "") : "");

      return `
        <article class="card" id="card-${i}" data-i="${i}" data-id="${esc(c.id)}">
          <div class="tagrow">${tags}</div>
          <h2 class="title">${esc(c.title)}</h2>
          ${prob ? `<div class="problem">${esc(prob)}</div>` : ""}
          ${main}
          <div class="actions">
            <button type="button" class="speak" data-act="speak">▶ 音声</button>
            <button type="button" class="learned${learnedOn}" data-act="learned">✓ 覚えた</button>
            <button type="button" class="mark${savedOn}" data-act="saved">☆ 保存</button>
          </div>
        </article>
      `;
    }

    function wireCard(el) {
      const i = Number(el.dataset.i);
      const c = filtered[i];
      if (!c) return;

      el.querySelector('[data-act="speak"]').onclick = () => {
        if (podcastOn) stopPodcast();
        let text;
        if (c.type === "quiz" && c.quiz) {
          text = [c.quiz.question, c.quiz.explain || "", c.detail || ""].filter(Boolean).join("。");
        } else {
          text = c.audio || [c.one_liner, c.when, c.detail, c.trap].filter(Boolean).join("。");
        }
        speak(text);
      };
      el.querySelector('[data-act="learned"]').onclick = () => {
        const pr = prog();
        if (pr.learned[c.id]) delete pr.learned[c.id]; else pr.learned[c.id] = Date.now();
        saveProg(pr);
        if (filter === "unlearned" || filter === "saved") applyFilter(false, false);
        else {
          el.querySelector('[data-act="learned"]').classList.toggle("on", !!pr.learned[c.id]);
          updateStats();
        }
      };
      el.querySelector('[data-act="saved"]').onclick = () => {
        const pr = prog();
        if (pr.saved[c.id]) delete pr.saved[c.id]; else pr.saved[c.id] = Date.now();
        saveProg(pr);
        if (filter === "saved") applyFilter(false, false);
        else {
          el.querySelector('[data-act="saved"]').classList.toggle("on", !!pr.saved[c.id]);
          updateStats();
        }
      };

      if (c.type === "quiz" && c.quiz) {
        let answered = false;
        el.querySelectorAll(".choices button").forEach(btn => {
          btn.onclick = () => {
            if (answered) return;
            answered = true;
            const j = Number(btn.dataset.j);
            const ok = j === c.quiz.answer;
            el.querySelectorAll(".choices button").forEach((b, k) => {
              b.disabled = true;
              if (k === c.quiz.answer) b.classList.add("correct");
              if (k === j && !ok) b.classList.add("wrong");
            });
            el.querySelector(".explain-slot").innerHTML =
              `<div class="explain"><b>${ok ? "正解" : "不正解"}</b><br>${esc(c.quiz.explain || "")}</div>`;
            if (c.track === "atcoder" && c.code) {
              el.querySelector(".sol-slot").innerHTML =
                `<div class="block"><div class="label">正解コード</div><pre class="code">${esc(c.code)}</pre></div>`;
            }
          };
        });
      }
    }

    function ensureShown(need) {
      if (!filtered.length) return;
      const target = Math.min(filtered.length, Math.max(need, shown));
      if (target <= shown) return;
      const frag = document.createDocumentFragment();
      const tmp = document.createElement("div");
      for (let i = shown; i < target; i++) {
        tmp.innerHTML = cardHTML(filtered[i], i);
        const el = tmp.firstElementChild;
        frag.appendChild(el);
      }
      // remove end marker if any
      const end = feed.querySelector(".end");
      if (end) end.remove();
      feed.appendChild(frag);
      for (let i = shown; i < target; i++) {
        const el = document.getElementById(`card-${i}`);
        if (el) {
          wireCard(el);
          if (io) io.observe(el);
        }
      }
      shown = target;
      if (shown >= filtered.length) {
        const e = document.createElement("div");
        e.className = "end";
        e.textContent = "ここまで";
        feed.appendChild(e);
      }
    }

    function setupObserver() {
      if (io) io.disconnect();
      io = new IntersectionObserver((entries) => {
        let best = null, bestRatio = 0;
        for (const e of entries) {
          if (e.isIntersecting && e.intersectionRatio >= bestRatio) {
            best = e; bestRatio = e.intersectionRatio;
          }
        }
        if (best) setActiveIndex(Number(best.target.dataset.i), false);
      }, { root: null, threshold: [0.35, 0.55, 0.75] });
    }

    function renderFeed(keepScroll = false) {
      const y = keepScroll ? window.scrollY : 0;
      feed.innerHTML = "";
      shown = 0;
      setupObserver();
      if (!filtered.length) {
        feed.innerHTML = '<div class="empty">カードがありません</div>';
        setActiveIndex(0, false);
        return;
      }
      ensureShown(Math.max(BATCH, idx + 1));
      setActiveIndex(idx, false);
      if (keepScroll) requestAnimationFrame(() => window.scrollTo(0, y));
      else {
        const el = document.getElementById(`card-${idx}`);
        if (el) el.scrollIntoView({ block: "start" });
        else window.scrollTo(0, 0);
      }
    }

    function renderGlossary(q = "") {
      const needle = (q || "").trim().toLowerCase();
      const collator = new Intl.Collator("ja");
      let rows = glossary.slice().sort((a, b) => collator.compare(a.term, b.term));
      if (needle) {
        rows = rows.filter(g => {
          const blob = [g.term, g.def, ...(g.aliases || [])].join(" ").toLowerCase();
          return blob.includes(needle);
        });
      }
      glossMeta.textContent = needle
        ? `${rows.length} / ${glossary.length} 語`
        : `${glossary.length} 語 · 五十音・辞書順`;
      glossList.innerHTML = rows.map(g => `
        <article class="gloss-item">
          <div class="term">${esc(g.term)}</div>
          <div class="def">${esc(g.def)}</div>
        </article>
      `).join("");
      glossBody.innerHTML = rows.map(g => `
        <tr>
          <td class="term-col">${esc(g.term)}</td>
          <td>${esc(g.def)}</td>
        </tr>
      `).join("");
      glossEmpty.hidden = rows.length > 0;
    }

    function setMode(mode) {
      glossView.classList.toggle("on", mode === "gloss");
      tapView.classList.toggle("on", mode === "tap");
      feed.classList.toggle("hide", mode !== "feed");
      jump.classList.toggle("hide", mode !== "feed");
      if (mode === "gloss") {
        showTapRandom(false);
        counter.textContent = "用語";
        updateStats();
        renderGlossary(glossQ.value);
        window.scrollTo(0, 0);
      }
      if (mode === "tap") {
        hideTapPop();
        renderTapList();
        window.scrollTo(0, 0);
      }
      if (mode === "feed") showTapRandom(false);
    }

    function showTapRandom(on) {
      tapRandom.classList.toggle("on", !!on);
    }

    function tapRec(id) {
      return prog().algotap[id] || null;
    }
    function tapStatus(id) {
      const r = tapRec(id);
      if (!r) return "none";
      return r.ok ? "ok" : "ng";
    }
    function hideTapPop() { tapPop.classList.remove("on"); tapPop.innerHTML = ""; }
    function hideTapFx() {
      clearTimeout(tapFxTimer);
      const fx = document.getElementById("tap-fx");
      fx.classList.remove("on");
      fx.innerHTML = "";
    }
    function playTapClear(streak) {
      const fx = document.getElementById("tap-fx");
      hideTapFx();
      fx.innerHTML = `<div class="fx-toast"><div class="fx-inner">
        <div class="fx-mark"></div>
        <div><div class="fx-n">${streak}問連続</div><div class="fx-sub">Very Good!</div></div>
      </div></div>`;
      fx.classList.add("on");
      try { navigator.vibrate?.(36); } catch {}
      tapFxTimer = setTimeout(hideTapFx, 2000);
    }

    function tapFilteredRows() {
      let rows = tapProblems.slice();
      const needle = (tapQ || "").trim().toLowerCase();
      if (tapFilter === "A" || tapFilter === "B" || tapFilter === "C" || tapFilter === "E" || tapFilter === "L") {
        rows = rows.filter(p => p.level === tapFilter);
      } else if (tapFilter === "none" || tapFilter === "ng") {
        rows = rows.filter(p => tapStatus(p.id) === tapFilter);
      }
      if (needle) {
        rows = rows.filter(p => {
          const blob = [p.id, p.title, p.pattern, p.problem].join(" ").toLowerCase();
          return blob.includes(needle);
        });
      }
      return rows;
    }

    function openRandomTap() {
      const rows = tapFilteredRows();
      const undone = rows.filter(p => tapStatus(p.id) !== "ok");
      const pool = undone.length ? undone : rows;
      if (!pool.length) return;
      openTap(pool[Math.floor(Math.random() * pool.length)].id);
    }

    function renderTapList() {
      hideTapFx();
      tapSolve.hidden = true;
      tapSolve.innerHTML = "";
      tapList.hidden = false;
      tapCurrent = null;
      showTapRandom(true);
      const chips = ["all", "A", "B", "C", "E", "L", "none", "ng"];
      const labels = { all: "全部", A: "A", B: "B", C: "C", E: "型", L: "LC", none: "未解答", ng: "復習" };
      const rows = tapFilteredRows();
      updateStats();
      tapList.innerHTML = `
        <div class="tap-help span-all">行を並べてプログラムにする。答え合わせでは、裏で Python を走らせて入力例と同じ出力になるかを見る。</div>
        <input class="gloss-search span-all" id="tap-q" type="search" placeholder="番号・型（例: A12 / LC1 / Two Sum）。Enterで絞る" enterkeyhint="search" value="${esc(tapQ)}" />
        <div class="tap-chips span-all">
          ${chips.map(k => `<button type="button" data-tf="${k}" class="${tapFilter === k ? "on" : ""}">${labels[k]}</button>`).join("")}
        </div>
        ${rows.map(p => {
          const st = tapStatus(p.id);
          const label = st === "ok" ? "できた" : st === "ng" ? "やり直し" : "まだ";
          return `<button type="button" class="tap-item" data-pid="${esc(p.id)}">
            <div class="row"><span class="ttl">${esc(p.title)}</span><span class="tap-lv">${esc(p.level)}</span></div>
            <div class="st ${st}">${label} · ${esc(p.pattern || "")}</div>
          </button>`;
        }).join("") || '<div class="empty span-all">この条件の問題はない</div>'}
      `;
      const qEl = document.getElementById("tap-q");
      if (qEl) {
        qEl.oninput = () => { tapQ = qEl.value; };
        qEl.onkeydown = (e) => {
          if (e.key === "Enter") { e.preventDefault(); tapQ = qEl.value; renderTapList(); }
        };
      }
      tapList.querySelectorAll("[data-tf]").forEach(b => {
        b.onclick = () => { tapFilter = b.dataset.tf; renderTapList(); };
      });
      tapList.querySelectorAll("[data-pid]").forEach(b => {
        b.onclick = () => openTap(b.dataset.pid);
      });
    }

    function openTap(id) {
      showTapRandom(false);
      pickBg();
      const p = tapProblems.find(x => x.id === id);
      if (!p) return;
      hideTapFx();
      tapCurrent = p;
      tapBuilt = [];
      tapPool = p.blocks.map(b => b.id);
      shuffleInPlace(tapPool);
      tapList.hidden = true;
      tapSolve.hidden = false;
      hideTapPop();
      counter.textContent = p.title;
      drawTapSolve();
      window.scrollTo(0, 0);
    }

    function blockById(id) {
      return (tapCurrent.blocks || []).find(b => b.id === id);
    }

    function lineHTML(id, kind) {
      const b = blockById(id);
      if (!b) return "";
      const pad = (b.indent || 0) * 12;
      return `<button type="button" class="tap-line ${kind}" data-bid="${esc(id)}" draggable="false">
        <span class="tap-grip" aria-hidden="true"></span>
        <span class="tap-code" style="padding-left:${pad}px">${esc(b.code)}</span>
      </button>`;
    }

    function tapIoHTML(p) {
      const io = (p.io && p.io[0]) ? p.io[0] : null;
      if (!p.io_fmt && !io) return "";
      const fmt = p.io_fmt
        ? `<details class="tap-fold"><summary>入力形式</summary><pre>${esc(p.io_fmt)}</pre></details>`
        : "";
      const sample = io
        ? `<div class="col"><div class="k">入力例</div><pre>${esc(io.in)}</pre>${io.out ? `<div class="k out">出力例</div><pre>${esc(io.out)}</pre>` : ""}</div>`
        : "";
      return `${fmt}<div class="tap-io solo">${sample}</div>`;
    }

    function drawTapSolve() {
      const p = tapCurrent;
      tapSolve.innerHTML = `
        <div class="tap-desk-q">
          <button type="button" class="tap-back" id="tap-back">← 一覧</button>
          <div class="tagrow"><span class="tap-lv">${esc(p.level)}</span><span class="tag">${esc(p.pattern || "")}</span></div>
          <h2 class="title">${esc(p.title)}</h2>
          <div class="tap-prob">${esc(p.problem)}</div>
          ${tapIoHTML(p)}
          ${p.url ? `<div class="tap-help"><a href="${esc(p.url)}" target="_blank" rel="noopener" style="color:#7dd3fc">公式問題</a></div>` : ""}
        </div>
        <div class="tap-desk-code">
          <div class="label">組み立て</div>
          <div class="tap-built">${tapBuilt.map(id => lineHTML(id, "built")).join("") || '<div class="tap-help">下の行をドラッグ、またはタップして足す</div>'}</div>
          <div class="label">まだ使ってない行</div>
          <div class="tap-pool">${tapPool.filter(id => !tapBuilt.includes(id)).map(id => lineHTML(id, "")).join("")}</div>
          <div class="tap-actions">
            <button type="button" id="tap-reset">リセット</button>
            <button type="button" class="check" id="tap-check">答え合わせ</button>
          </div>
          <div class="tap-sheet" id="tap-sheet"></div>
          <div class="tap-help">ドラッグで並べ替え。タップで足す／戻す。長押しでその行の意味。並べたプログラムを裏で走らせて、入力例と同じ出力になるかで見る。初期化の順が違っても、同じ結果ならよい。</div>
        </div>
      `;
      document.getElementById("tap-back").onclick = () => renderTapList();
      document.getElementById("tap-reset").onclick = () => {
        tapBuilt = [];
        tapPool = tapCurrent.blocks.map(b => b.id);
        shuffleInPlace(tapPool);
        hideTapPop();
        drawTapSolve();
      };
      document.getElementById("tap-check").onclick = () => checkTap();
      tapSolve.querySelectorAll(".tap-line").forEach(el => wireTapLine(el));
    }

    function wireTapLine(el) {
      const id = el.dataset.bid;
      el.addEventListener("pointerdown", (e) => {
        if (e.button && e.button !== 0) return;
        if (tapDrag) return;
        const r = el.getBoundingClientRect();
        tapDrag = {
          id,
          el,
          from: el.classList.contains("built") ? "built" : "pool",
          x: e.clientX,
          y: e.clientY,
          ox: e.clientX - r.left,
          oy: e.clientY - r.top,
          w: r.width,
          started: false,
          long: false,
          idx: 0,
          over: null,
          pid: e.pointerId,
          timer: setTimeout(() => {
            if (!tapDrag || tapDrag.started) return;
            tapDrag.long = true;
            tapLong = true;
            showTapHint(id);
          }, 480),
        };
      });
    }

    function tapClearPh() {
      document.querySelectorAll(".tap-ph").forEach(n => n.remove());
    }

    function tapDropIndex(container, y) {
      const lines = [...container.querySelectorAll(".tap-line:not(.ghost):not(.src)")];
      for (let i = 0; i < lines.length; i++) {
        const r = lines[i].getBoundingClientRect();
        if (y < r.top + r.height / 2) return i;
      }
      return lines.length;
    }

    function tapOverList(x, y) {
      const built = tapSolve.querySelector(".tap-built");
      const pool = tapSolve.querySelector(".tap-pool");
      const hit = (box) => {
        if (!box) return false;
        const r = box.getBoundingClientRect();
        return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
      };
      if (hit(built)) return "built";
      if (hit(pool)) return "pool";
      const near = (box) => {
        if (!box) return false;
        const r = box.getBoundingClientRect();
        return x >= r.left - 12 && x <= r.right + 12 && y >= r.top - 24 && y <= r.bottom + 24;
      };
      if (near(built)) return "built";
      if (near(pool)) return "pool";
      return null;
    }

    function tapStartGhost() {
      const d = tapDrag;
      clearTimeout(d.timer);
      hideTapPop();
      d.el.classList.add("src");
      const g = d.el.cloneNode(true);
      g.classList.add("ghost");
      g.classList.remove("src");
      g.style.width = d.w + "px";
      document.body.appendChild(g);
      d.ghost = g;
      document.body.classList.add("tap-on-drag");
      try { d.el.setPointerCapture(d.pid); } catch {}
    }

    function tapMoveGhost(e) {
      const d = tapDrag;
      if (d.ghost) {
        d.ghost.style.left = (e.clientX - d.ox) + "px";
        d.ghost.style.top = (e.clientY - d.oy) + "px";
      }
      const over = tapOverList(e.clientX, e.clientY);
      d.over = over;
      tapClearPh();
      if (!over) return;
      const box = tapSolve.querySelector(over === "built" ? ".tap-built" : ".tap-pool");
      const empty = box.querySelector(".tap-help");
      if (empty) empty.remove();
      const idx = tapDropIndex(box, e.clientY);
      d.idx = idx;
      const ph = document.createElement("div");
      ph.className = "tap-ph";
      const lines = [...box.querySelectorAll(".tap-line:not(.ghost):not(.src)")];
      if (idx >= lines.length) box.appendChild(ph);
      else box.insertBefore(ph, lines[idx]);
    }

    function tapCommit(d) {
      const id = d.id;
      if (d.over === "built") {
        let idx = d.idx || 0;
        if (d.from === "pool") {
          tapBuilt = tapBuilt.filter(x => x !== id);
          if (idx > tapBuilt.length) idx = tapBuilt.length;
          tapBuilt.splice(idx, 0, id);
        } else {
          const fromIdx = tapBuilt.indexOf(id);
          if (fromIdx < 0) return;
          tapBuilt.splice(fromIdx, 1);
          if (idx > tapBuilt.length) idx = tapBuilt.length;
          if (idx < 0) idx = 0;
          tapBuilt.splice(idx, 0, id);
        }
      } else if (d.over === "pool" && d.from === "built") {
        tapBuilt = tapBuilt.filter(x => x !== id);
      }
    }

    function tapEndDrag() {
      const d = tapDrag;
      if (!d) return;
      clearTimeout(d.timer);
      if (d.ghost) d.ghost.remove();
      tapClearPh();
      document.body.classList.remove("tap-on-drag");
      tapDrag = null;
      if (d.started) {
        tapCommit(d);
        drawTapSolve();
        return;
      }
      if (d.long || tapLong) {
        tapLong = false;
        return;
      }
      hideTapPop();
      if (d.el.classList.contains("built")) tapBuilt = tapBuilt.filter(x => x !== d.id);
      else tapBuilt.push(d.id);
      drawTapSolve();
    }

    function showTapHint(id) {
      const b = blockById(id);
      if (!b) return;
      tapPop.innerHTML = `<div class="k">この行</div><code>${esc(b.code)}</code>${esc(b.hint || "")}`;
      tapPop.classList.add("on");
    }

    const TAP_SKIP = new Set("print input range len int str list map set dict min max sum abs sorted reversed enumerate zip any all True False None open heapq sys bisect math collections itertools functools defaultdict deque Counter heapify heappush heappop bisect_left bisect_right".split(" "));
    function tapIdents(s) {
      return (s.match(/[A-Za-z_][A-Za-z0-9_]*/g) || []).filter(t => !TAP_SKIP.has(t));
    }
    function tapAnalyze(code) {
      const s = code.trim();
      let defines = new Set(), uses = new Set();
      const am = s.match(/^([A-Za-z_][A-Za-z0-9_]*(?:\s*,\s*[A-Za-z_][A-Za-z0-9_]*)*)\s*=(?!=)/);
      if (am) {
        am[1].split(",").forEach(x => { if (x.trim()) defines.add(x.trim()); });
        uses = new Set(tapIdents(s.slice(am[0].length)));
      } else {
        const fm = s.match(/^for\s+(.+?)\s+in\s+/);
        if (fm) {
          fm[1].split(",").forEach(x => { const n = x.trim(); if (n && n !== "_") defines.add(n); });
          uses = new Set(tapIdents(s.slice(fm[0].length)));
        } else {
          uses = new Set(tapIdents(s));
        }
      }
      return {
        defines, uses,
        input: s.includes("input("),
        print: s.includes("print("),
        header: s.endsWith(":"),
        elifElse: /^(elif|else)\b/.test(s),
        ifLike: /^(if|elif)\b/.test(s),
      };
    }
    function tapFp(b) { return b.code + "\t" + (b.indent || 0); }
    function tapCode(p, user) {
      const byId = Object.fromEntries(p.blocks.map(b => [b.id, b]));
      return user.map(id => {
        const b = byId[id];
        return " ".repeat(b.indent || 0) + b.code;
      }).join("\n") + "\n";
    }
    let tapWorker = null;
    function tapExec(p, user) {
      const run = p.run || { mode: "stdio" };
      const payload = { code: tapCode(p, user), run, io: p.io || [] };
      return new Promise((resolve) => {
        let done = false;
        const finish = (r) => {
          if (done) return;
          done = true;
          resolve(r);
        };
        try {
          if (!tapWorker) tapWorker = new Worker("py-worker.js");
        } catch (e) {
          finish({ ok: false, why: String(e) });
          return;
        }
        const t = setTimeout(() => {
          try { tapWorker.terminate(); } catch (_) {}
          tapWorker = null;
          finish({ ok: false, why: "timeout" });
        }, 8000);
        tapWorker.onmessage = (ev) => {
          clearTimeout(t);
          finish(ev.data || { ok: false, why: "no result" });
        };
        tapWorker.onerror = (ev) => {
          clearTimeout(t);
          finish({ ok: false, why: ev.message || "worker" });
        };
        tapWorker.postMessage(payload);
      });
    }
    function tapAccept(p, user) {
      const official = p.answer.map(id => p.blocks.find(b => b.id === id)).filter(Boolean);
      if (user.length !== official.length) return { ok: false, why: "行数が違う" };
      const byId = Object.fromEntries(p.blocks.map(b => [b.id, b]));
      if (user.some(id => !byId[id])) return { ok: false, why: "未知の行" };
      let prev = 0, saw = false;
      for (let i = 0; i < user.length; i++) {
        const b = byId[user[i]];
        const ind = b.indent || 0;
        if (i === 0 && ind !== 0) return { ok: false, why: "インデントが壊れている" };
        if (ind > prev && !saw) return { ok: false, why: "インデントが壊れている" };
        prev = ind;
        saw = b.code.trim().endsWith(":");
      }
      const unused = official.map((_, i) => i);
      const mapping = [];
      for (const uid of user) {
        const fp = tapFp(byId[uid]);
        const k = unused.findIndex(oi => tapFp(official[oi]) === fp);
        if (k < 0) return { ok: false, why: "行の対応が取れない" };
        mapping.push(unused.splice(k, 1)[0]);
      }
      const infos = official.map(b => tapAnalyze(b.code));
      const parent = official.map((b, i) => {
        const ind = b.indent || 0;
        for (let j = i - 1; j >= 0; j--) if ((official[j].indent || 0) < ind) return j;
        return null;
      });
      const desc = i => {
        const out = [];
        parent.forEach((p0, j) => {
          let k = p0;
          while (k != null) {
            if (k === i) { out.push(j); break; }
            k = parent[k];
          }
        });
        return out;
      };
      const userPos = {};
      mapping.forEach((oi, k) => { userPos[oi] = k; });
      for (let i = 0; i < official.length; i++) {
        if (!infos[i].header) continue;
        const d = desc(i);
        if (!d.length) continue;
        const pos = d.map(j => userPos[j]);
        const head = userPos[i];
        if (Math.min(...pos) !== head + 1 || Math.max(...pos) !== head + d.length) {
          return { ok: false, why: "ブロックの入れ子が壊れている" };
        }
        const sorted = pos.slice().sort((a, b) => a - b);
        for (let t = 0; t < d.length; t++) if (sorted[t] !== head + 1 + t) {
          return { ok: false, why: "ブロックの入れ子が壊れている" };
        }
      }
      return { ok: true, why: "ok" };
    }
    async function checkTap() {
      const p = tapCurrent;
      const sheet = document.getElementById("tap-sheet");
      if (tapBuilt.length !== p.answer.length) {
        sheet.className = "tap-sheet on ng";
        sheet.textContent = "行が足りない。全部並べてから。";
        return;
      }
      const pre = tapAccept(p, tapBuilt);
      if (!pre.ok) {
        tapStreak = 0;
        sheet.className = "tap-sheet on ng";
        sheet.textContent = "違う。並びを直してもう一回。正解はまだ出さない。";
        const pr0 = prog();
        const prev0 = pr0.algotap[p.id] || { tries: 0 };
        pr0.algotap[p.id] = { ok: false, at: Date.now(), tries: (prev0.tries || 0) + 1 };
        saveProg(pr0);
        updateStats();
        return;
      }
      sheet.className = "tap-sheet on";
      sheet.textContent = tapWorker ? "走らせている…" : "判定の準備（初回だけ少し待つ）…";
      const ran = await tapExec(p, tapBuilt);
      const ok = !!ran.ok;
      const pr = prog();
      const prev = pr.algotap[p.id] || { tries: 0 };
      pr.algotap[p.id] = { ok, at: Date.now(), tries: (prev.tries || 0) + 1 };
      saveProg(pr);
      updateStats();
      if (!ok) {
        tapStreak = 0;
        sheet.className = "tap-sheet on ng";
        sheet.textContent = "違う。この並びを走らせたら、入力例と同じ出力にならなかった。";
        return;
      }
      tapStreak += 1;
      playTapClear(tapStreak);
      sheet.className = "tap-sheet on ok";
      sheet.innerHTML = `<b>できた</b><div class="tap-streak">連続 ${tapStreak}</div>この並びを走らせて、入力例と同じ出力になった。<br>${esc(p.explain || "")}${p.complexity ? `<br>計算量 ${esc(p.complexity)}` : ""}
        <div class="tap-actions" style="margin-top:10px">
          <button type="button" id="tap-next">次の問題</button>
        </div>`;
      const nxt = nextTap(p.id);
      const nextBtn = document.getElementById("tap-next");
      nextBtn.onclick = () => {
        if (nxt) openTap(nxt.id);
        else renderTapList();
      };
      sheet.scrollIntoView({ behavior: "smooth", block: "end" });
    }

    function nextTap(id) {
      const i = tapProblems.findIndex(p => p.id === id);
      for (let k = 1; k < tapProblems.length; k++) {
        const p = tapProblems[(i + k) % tapProblems.length];
        if (tapStatus(p.id) !== "ok") return p;
      }
      return tapProblems[(i + 1) % tapProblems.length] || null;
    }

    function applyFilter(doShuffle = false, resetIdx = true) {
      if (filter === "glossary") {
        setMode("gloss");
        updateStats();
        return;
      }
      if (filter === "algotap") {
        setMode("tap");
        updateStats();
        return;
      }
      setMode("feed");
      const p = prog();
      filtered = cards.filter(c => {
        if (filter === "saved") return c.type !== "quiz" && !!p.saved[c.id];
        if (filter === "unlearned") return c.type !== "quiz" && !p.learned[c.id];
        if (filter === "quiz") return c.type === "quiz";
        if (filter === "code") return c.type === "code";
        if (filter === "all") return c.type !== "quiz";
        if (filter === "atcoder" || filter === "security") {
          return c.track === filter && c.type !== "quiz";
        }
        return false;
      });
      if (doShuffle || filter === "all" || filter === "unlearned") shuffleInPlace(filtered);
      if (resetIdx) idx = 0;
      else idx = filtered.length ? Math.min(idx, filtered.length - 1) : 0;
      renderFeed(false);
      updateStats();
    }

    let podcastOn = false;
    let podcastToken = 0;
    let speakKeepAlive = null;
    const podBtn = document.getElementById("podcast");
    const podBanner = document.getElementById("pod-banner");

    function cardSpeechText(c) {
      if (!c) return "";
      if (c.type === "quiz" && c.quiz) {
        return [
          c.title,
          c.quiz.question,
          "解説。",
          c.quiz.explain || "",
          c.detail || "",
        ].filter(Boolean).join("。");
      }
      // コード全文は長いので読み上げ対象から外す
      return c.audio || [
        c.title,
        c.problem,
        c.one_liner,
        c.when,
        c.detail,
        c.trap,
      ].filter(Boolean).join("。");
    }

    function stopSpeakEngine() {
      if (speakKeepAlive) {
        clearInterval(speakKeepAlive);
        speakKeepAlive = null;
      }
      if (window.speechSynthesis) window.speechSynthesis.cancel();
    }

    function setPodcastUI(on) {
      podcastOn = on;
      podBtn.classList.toggle("on", on);
      podBanner.classList.toggle("on", on);
      podBtn.setAttribute("aria-pressed", on ? "true" : "false");
      podBtn.title = on ? "停止" : "読み上げて自動送り";
    }

    function stopPodcast() {
      podcastToken += 1;
      setPodcastUI(false);
      stopSpeakEngine();
    }

    function speak(text, { onEnd } = {}) {
      if (!window.speechSynthesis) {
        alert("音声未対応のブラウザです");
        if (onEnd) onEnd(false);
        return;
      }
      stopSpeakEngine();
      const cleaned = String(text || "")
        .replace(/```[\s\S]*?```/g, " ")
        .replace(/[#*`|>]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
      if (!cleaned) {
        if (onEnd) onEnd(true);
        return;
      }
      const u = new SpeechSynthesisUtterance(cleaned);
      u.lang = "ja-JP";
      u.rate = 1.05;
      u.onend = () => { if (onEnd) onEnd(true); };
      u.onerror = () => { if (onEnd) onEnd(false); };
      // Chrome系で途中停止する対策
      speakKeepAlive = setInterval(() => {
        if (!window.speechSynthesis.speaking) return;
        window.speechSynthesis.pause();
        window.speechSynthesis.resume();
      }, 12000);
      window.speechSynthesis.speak(u);
    }

    function playPodcastFrom(startIdx) {
      if (!filtered.length || filter === "glossary" || filter === "algotap") {
        stopPodcast();
        return;
      }
      const myToken = ++podcastToken;
      setPodcastUI(true);

      const run = (i) => {
        if (myToken !== podcastToken || !podcastOn) return;
        if (i >= filtered.length) {
          stopPodcast();
          return;
        }
        const c = filtered[i];
        ensureShown(i + 1);
        setActiveIndex(i, true);
        speak(cardSpeechText(c), {
          onEnd: (ok) => {
            if (myToken !== podcastToken || !podcastOn) return;
            if (!ok) {
              stopPodcast();
              return;
            }
            // カード間の短い間
            setTimeout(() => {
              if (myToken !== podcastToken || !podcastOn) return;
              run(i + 1);
            }, 450);
          },
        });
      };
      run(Math.max(0, startIdx));
    }

    function togglePodcast() {
      if (podcastOn) {
        stopPodcast();
        return;
      }
      if (filter === "glossary" || filter === "algotap") {
        alert("用語一覧と AlgoTap では使えません");
        return;
      }
      if (!filtered.length) {
        alert("再生するカードがありません");
        return;
      }
      playPodcastFrom(idx);
    }

    function go(delta) {
      if (!filtered.length) return;
      if (podcastOn) stopPodcast();
      const next = Math.max(0, Math.min(filtered.length - 1, idx + delta));
      ensureShown(next + 1);
      setActiveIndex(next, true);
    }

    document.getElementById("prev").onclick = () => go(-1);
    document.getElementById("next").onclick = () => go(1);
    podBtn.onclick = () => togglePodcast();
    document.addEventListener("keydown", e => {
      if (e.key === "ArrowUp" || e.key === "ArrowLeft") { e.preventDefault(); go(-1); }
      if (e.key === "ArrowDown" || e.key === "ArrowRight") { e.preventDefault(); go(1); }
      if (e.key === " " && !/input|textarea/i.test(e.target.tagName)) {
        e.preventDefault();
        togglePodcast();
      }
    });

    document.getElementById("shuffle").onclick = () => {
      if (podcastOn) stopPodcast();
      if (filter === "algotap" || filter === "glossary") return;
      applyFilter(true, true);
    };
    tapPop.onclick = () => hideTapPop();
    document.addEventListener("pointermove", (e) => {
      if (!tapDrag || e.pointerId !== tapDrag.pid) return;
      if (tapDrag.long) return;
      const dx = e.clientX - tapDrag.x;
      const dy = e.clientY - tapDrag.y;
      if (!tapDrag.started) {
        if (Math.hypot(dx, dy) < 10) return;
        tapDrag.started = true;
        tapStartGhost();
      }
      e.preventDefault();
      tapMoveGhost(e);
    }, { passive: false });
    document.addEventListener("pointerup", (e) => {
      if (!tapDrag || e.pointerId !== tapDrag.pid) return;
      tapEndDrag();
    });
    document.addEventListener("pointercancel", (e) => {
      if (!tapDrag || e.pointerId !== tapDrag.pid) return;
      tapEndDrag();
    });
    function setMenu(on) {
      menuSheet.classList.toggle("on", on);
      menuBtn.classList.toggle("on", on);
      menuBtn.setAttribute("aria-expanded", on ? "true" : "false");
    }
    function goFilter(name) {
      if (podcastOn) stopPodcast();
      document.querySelectorAll(".filters button[data-f]").forEach(b => {
        b.classList.toggle("active", b.dataset.f === name);
      });
      filter = name;
      setMenu(false);
      applyFilter(filter === "all" || filter === "unlearned", true);
    }
    let bgList = [];
    function bgOn() {
      return new URLSearchParams(location.search).get("bg") === "1";
    }
    function setBgParam(on) {
      const u = new URL(location.href);
      if (on) u.searchParams.set("bg", "1");
      else u.searchParams.delete("bg");
      history.replaceState(null, "", u.pathname + u.search + u.hash);
      const btn = document.getElementById("bg-btn");
      if (btn) btn.classList.toggle("active", on);
      pickBg();
    }
    function pickBg() {
      const on = bgOn();
      const html = document.documentElement;
      if (!on || !bgList.length) {
        html.classList.remove("bg-on");
        html.style.backgroundImage = "";
        return;
      }
      const name = bgList[Math.floor(Math.random() * bgList.length)];
      html.classList.add("bg-on");
      html.style.backgroundImage = `url("./bg/${name}")`;
    }
    menuBtn.onclick = () => setMenu(!menuSheet.classList.contains("on"));
    document.querySelectorAll(".filters button[data-f]").forEach(btn => {
      btn.onclick = () => goFilter(btn.dataset.f);
    });
    document.getElementById("bg-btn").onclick = () => setBgParam(!bgOn());
    document.getElementById("home").onclick = () => goFilter("algotap");

    // 追加読み込み（下まで近づいたら）
    window.addEventListener("scroll", () => {
      if (shown >= filtered.length) return;
      if (window.innerHeight + window.scrollY > document.body.offsetHeight - 900) {
        ensureShown(shown + BATCH);
      }
    }, { passive: true });

    glossQ.addEventListener("input", () => renderGlossary(glossQ.value));
    tapRandom.onclick = () => openRandomTap();

    // 画面を離れたら停止（意図しない読み上げ継続を防ぐ）
    document.addEventListener("visibilitychange", () => {
      if (document.hidden && podcastOn) stopPodcast();
    });

    fetch("./cards.json")
      .then(r => r.json())
      .then(data => {
        cards = data;
        return fetch("./glossary.json").then(r => r.json()).catch(() => []);
      })
      .then(g => {
        glossary = Array.isArray(g) ? g : [];
        return fetch("./algotap.json").then(r => r.json()).catch(() => []);
      })
      .then(t => {
        tapProblems = Array.isArray(t) ? t : [];
        applyFilter(false, true);
        return fetch("./bg/list.json").then(r => r.ok ? r.json() : []).catch(() => []);
      })
      .then(list => {
        bgList = Array.isArray(list) ? list.filter(Boolean) : [];
        const btn = document.getElementById("bg-btn");
        if (btn) btn.classList.toggle("active", bgOn());
        pickBg();
      })
      .catch(() => { feed.innerHTML = '<div class="empty">cards.json が見つかりません</div>'; });
  </script>
</body>
</html>
